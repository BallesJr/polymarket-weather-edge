name: Weather Edge Bot

on:
  schedule:
    # Fallback only: GitHub throttles busy cron slots heavily (observed ~7 runs/day
    # on */30). The primary trigger is an external scheduler calling
    # workflow_dispatch every 30 minutes; :07/:37 avoids the congested :00/:30 slots.
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Serialize runs that write to the repo so portfolio commits never race
concurrency:
  group: weather-bot-write
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot cycle
        run: python paper_trader.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_portfolio_weather.json || true
          git diff --staged --quiet || git commit -m "bot: portfolio update $(date -u +'%Y-%m-%d %H:%M UTC')"
          n=0
          until git pull --rebase && git push; do
            git rebase --abort || true
            n=$((n+1))
            if [ $n -ge 3 ]; then exit 1; fi
            sleep 10
          done
