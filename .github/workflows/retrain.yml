name: Weekly Model Retrain

on:
  schedule:
    - cron: "0 4 * * 0"  # Every Sunday at 04:00 UTC
  workflow_dispatch:

# Share the bot's group so a retrain never races a portfolio commit
concurrency:
  group: weather-bot-write
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain RF model
        run: python calibration_weather.py

      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/rf_weather.pkl || true
          git diff --staged --quiet || git commit -m "chore: weekly model retrain $(date -u +'%Y-%m-%d')"
          git pull --rebase && git push
